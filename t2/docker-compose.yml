services:
  db:
    image: pgrouting/pgrouting:17-3.5-3.7.3
    container_name: t2-pgrouting
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resilience}
      POSTGRES_USER: ${POSTGRES_USER:-resilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilience}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - t2_pgdata:/var/lib/postgresql/data
      - ./:/workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resilience} -d ${POSTGRES_DB:-resilience}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  t2_pgdata:
